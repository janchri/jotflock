[package]
name = "jotflock"
version = "0.3.0-alpha.1"
edition = "2021"
description = "A native, local-first collaborative whiteboard"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
directories = "6"
anyhow = "1"
automerge = "0.12"
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "macros"] }
base64 = "0.22"
rand = "0.10"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
proptest = "1.12"
